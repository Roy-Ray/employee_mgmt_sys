<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Employee Login | SmartHR</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    />
    <link rel="stylesheet" href="css/style.css" />
    <style>
      body {
        background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      }

      .login-card {
        background: rgba(255, 255, 255, 0.95);
        border-radius: 20px;
        padding: 40px;
        width: 100%;
        max-width: 400px;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
        animation: fadeInUp 0.6s ease-out;
        position: relative;
        overflow: hidden;
      }

      /* Green top border for Employee */
      .login-card::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 6px;
        background: #198754;
      }

      .icon-circle {
        width: 70px;
        height: 70px;
        background-color: #d1e7dd;
        color: #198754;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 2rem;
        margin: 0 auto 20px auto;
      }

      .form-control {
        border-radius: 10px;
        padding: 12px 15px;
        border: 1px solid #dee2e6;
        background-color: #f8f9fa;
      }
      .form-control:focus {
        background-color: #fff;
        border-color: #198754;
        box-shadow: 0 0 0 4px rgba(25, 135, 84, 0.1);
      }

      .btn-login {
        width: 100%;
        padding: 12px;
        border-radius: 10px;
        font-weight: 600;
        text-transform: uppercase;
        background: #198754;
        border: none;
        color: white;
        transition: all 0.3s;
      }
      .btn-login:hover {
        background: #157347;
        transform: translateY(-2px);
        box-shadow: 0 5px 15px rgba(25, 135, 84, 0.3);
      }

      .back-link {
        display: block;
        text-align: center;
        margin-top: 20px;
        color: #6c757d;
        text-decoration: none;
        font-size: 0.9rem;
      }
      .back-link:hover { color: #198754; }

      @keyframes fadeInUp {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
      }
    </style>
  </head>
  <body>
    
    <div class="login-card">
      <div class="icon-circle">
        <i class="fas fa-user-tie"></i>
      </div>
      <h3 class="text-center fw-bold mb-4" style="color: #1f2937;">Employee Login</h3>
      
      <form id="loginForm">
        <div class="mb-3">
          <label class="form-label text-muted small fw-bold">EMAIL ADDRESS</label>
          <input type="email" id="email" class="form-control" placeholder="user@smart.com" required>
        </div>
        <div class="mb-4">
          <label class="form-label text-muted small fw-bold">PASSWORD</label>
          <input type="password" id="password" class="form-control" placeholder="••••••" required>
        </div>
        
        <button type="submit" class="btn btn-login">
          Access Portal
        </button>
      </form>

      <a href="index.html" class="back-link">
        <i class="fas fa-arrow-left me-1"></i> Back to Portal Selection
      </a>
    </div>

    <div id="loginOverlay" class="d-none position-fixed top-0 start-0 w-100 h-100 bg-dark bg-opacity-75 d-flex justify-content-center align-items-center" style="z-index: 9999;">
        <div class="bg-white p-4 rounded shadow-lg text-center">
            <div class="spinner-border text-success mb-3" role="status"></div>
            <h3 class="fw-bold">Logging In...</h3>
            <p class="text-muted">Loading Dashboard</p>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            try {
                const res = await fetch('/api/login', { 
                    method: 'POST', 
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password, role: 'Employee' }) 
                });

                const data = await res.json();

                if (data.success) {
                    document.getElementById('loginOverlay').classList.remove('d-none');
                    localStorage.setItem('user', JSON.stringify(data.user));
                    
                    setTimeout(() => {
                        window.location.href = 'emp_dashboard.html';
                    }, 400);
                } else {
                    alert(data.message);
                }
            } catch (err) {
                alert("Login Server Error");
            }
        });
    </script>
  </body>
</html>
