<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Employee Login | SmartHR Enterprise</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: { sans: ['Inter', 'sans-serif'] },
            colors: { corporate: { 900: '#0B132B', 800: '#1C2541' } }
          }
        }
      }
    </script>
    <style type="text/tailwindcss">
      @import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap");
      
      body { font-family: 'Inter', sans-serif; @apply bg-corporate-900 min-h-screen flex items-center justify-center relative overflow-hidden; }
      
      /* Subtle corporate background pattern */
      body::before {
        content: ""; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%;
        background: radial-gradient(circle, rgba(16,185,129,0.08) 0%, rgba(11,19,43,0) 70%); z-index: 0; pointer-events: none;
      }

      .login-container { @apply w-full max-w-md p-6 z-10; }
      
      .login-card { @apply bg-white rounded-lg shadow-[0_20px_50px_rgba(0,0,0,0.3)] p-10 border-t-4 border-emerald-600 relative overflow-hidden; }
      
      .form-label { @apply block text-xs font-bold text-slate-500 uppercase tracking-widest mb-2; }
      .form-control { @apply w-full rounded-md border border-slate-300 bg-slate-50 px-4 py-3 text-sm text-slate-800 transition-all focus:bg-white focus:border-emerald-600 focus:ring-2 focus:ring-emerald-600/20 outline-none; }
      
      .btn-login { @apply w-full mt-2 bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-3.5 rounded-md transition-colors shadow-md flex justify-center items-center gap-2; }
      
      .back-link { @apply flex items-center justify-center mt-6 text-sm text-slate-500 hover:text-emerald-600 transition-colors font-medium; }
    </style>
  </head>
  <body>
    
    <div class="login-container">
      <div class="text-center mb-8">
        <h1 class="text-2xl font-bold text-white tracking-wide">SmartHR <span class="text-emerald-500">Enterprise</span></h1>
        <p class="text-slate-400 text-sm mt-1">Employee Self-Service Portal</p>
      </div>

      <div class="login-card">
        <div class="w-16 h-16 bg-emerald-50 text-emerald-600 rounded-full flex items-center justify-center text-2xl mx-auto mb-6 shadow-sm border border-emerald-100">
          <i class="fas fa-id-badge"></i>
        </div>
        
        <form id="loginForm">
          <div class="mb-5">
            <label class="form-label">Employee Email</label>
            <input type="email" id="email" class="form-control" placeholder="employee@smarthr.com" required>
          </div>
          <div class="mb-6">
            <label class="form-label">Password</label>
            <input type="password" id="password" class="form-control" placeholder="••••••••" required>
          </div>
          
          <button type="submit" class="btn-login">
            Sign In <i class="fas fa-sign-in-alt text-xs"></i>
          </button>
        </form>

        <a href="index.html" class="back-link">
          <i class="fas fa-arrow-left me-2"></i> Return to Portal Selection
        </a>
      </div>
    </div>

    <div id="loginOverlay" class="d-none fixed inset-0 bg-corporate-900/90 backdrop-blur-sm z-[9999] flex justify-center items-center">
        <div class="bg-white p-8 rounded-lg shadow-2xl text-center border-t-4 border-emerald-600 w-80">
            <div class="spinner-border text-emerald-600 mb-4 h-8 w-8" role="status"></div>
            <h3 class="font-bold text-slate-800 text-lg">Logging In...</h3>
            <p class="text-slate-500 text-sm mt-1">Loading Employee Dashboard</p>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            try {
                const res = await fetch('/api/login', { 
                    method: 'POST', 
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password, role: 'Employee' }) 
                });

                const data = await res.json();

                if (data.success) {
                    document.getElementById('loginOverlay').classList.remove('d-none');
                    localStorage.setItem('user', JSON.stringify(data.user));
                    
                    setTimeout(() => {
                        window.location.href = 'emp_dashboard.html';
                    }, 400);
                } else {
                    alert(data.message);
                }
            } catch (err) {
                alert("Login Server Error");
            }
        });
    </script>
  </body>
</html>
