<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Select Portal | SmartHR</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    />
    <link rel="stylesheet" href="css/style.css" />

    <style>
      /* OVERRIDE: Specific styles for the landing page */
      
      body {
        /* Keeping your original background */
        background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      }

      .landing-container {
        width: 100%;
        max-width: 1000px;
        padding: 20px;
        animation: fadeInUp 0.8s ease-out;
      }

      .main-title {
        color: white;
        font-weight: 800;
        font-size: 2.8rem;
        margin-bottom: 60px;
        text-align: center;
        text-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        letter-spacing: 0.5px;
      }

      /* CARD STYLING */
      .portal-card {
        background: rgba(255, 255, 255, 0.98);
        border-radius: 20px;
        padding: 50px 30px;
        border: none;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
        transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        
        /* FLEX MAGIC FOR EQUAL HEIGHT & ALIGNMENT */
        height: 100%; 
        width: 100%;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        align-items: center;
        text-align: center;
        position: relative;
        overflow: hidden;
      }

      .portal-card:hover {
        transform: translateY(-10px);
        box-shadow: 0 30px 60px rgba(0, 0, 0, 0.3);
      }

      /* Colored top border */
      .portal-card::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 6px;
      }
      .card-admin::before { background: #0d6efd; }
      .card-emp::before { background: #198754; }

      .portal-card h3 {
        font-weight: 700;
        color: #1f2937;
        margin-bottom: 15px;
        font-size: 1.5rem;
      }

      .portal-card p {
        color: #6b7280;
        font-size: 1rem;
        margin-bottom: 40px; /* Space before button */
        line-height: 1.6;
      }

      /* BUTTON STYLING */
      .btn-custom {
        width: 100%;
        padding: 14px;
        border-radius: 12px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.8px;
        font-size: 0.9rem;
        transition: all 0.3s ease;
        text-decoration: none;
        display: inline-block;
      }

      .btn-outline-admin {
        border: 2px solid #0d6efd;
        color: #0d6efd;
      }
      .btn-outline-admin:hover {
        background: #0d6efd;
        color: white;
        box-shadow: 0 5px 15px rgba(13, 110, 253, 0.3);
      }

      .btn-outline-emp {
        border: 2px solid #198754;
        color: #198754;
      }
      .btn-outline-emp:hover {
        background: #198754;
        color: white;
        box-shadow: 0 5px 15px rgba(25, 135, 84, 0.3);
      }

      /* Animation */
      @keyframes fadeInUp {
        from { opacity: 0; transform: translateY(30px); }
        to { opacity: 1; transform: translateY(0); }
      }
    </style>
  </head>
  <body>
    
    <div class="landing-container">
      <h1 class="main-title">Welcome to Employee Management Portal</h1>

      <div class="row g-4 justify-content-center align-items-stretch">
        
        <div class="col-md-5 col-sm-10 d-flex">
          <div class="portal-card card-admin">
            <div class="card-content">
              <h3>Admin Portal</h3>
              <p>
                Manage Employees, Payroll & Analytics
              </p>
            </div>
            <a href="admin_login.html" class="btn-custom btn-outline-admin">
              Login as Admin
            </a>
          </div>
        </div>

        <div class="col-md-5 col-sm-10 d-flex">
          <div class="portal-card card-emp">
            <div class="card-content">
              <h3>Employee Portal</h3>
              <p>
                Mark Attendance, Apply Leave & View Salary
              </p>
            </div>
            <a href="emp_login.html" class="btn-custom btn-outline-emp">
              Login as Employee
            </a>
          </div>
        </div>

      </div>
    </div>

  </body>
</html>
