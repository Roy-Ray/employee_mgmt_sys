<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Select Portal | SmartHR</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: { sans: ['Inter', 'sans-serif'] }
          }
        }
      }
    </script>
    <style type="text/tailwindcss">
      @import url("https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap");
      body { 
        font-family: 'Inter', sans-serif; 
        @apply bg-gradient-to-br from-slate-900 via-indigo-950 to-slate-900 flex items-center justify-center min-h-screen relative; 
      }
      .landing-container { @apply w-full max-w-5xl p-6 mx-auto z-10; }
      .main-title { @apply text-white font-extrabold text-5xl mb-16 text-center tracking-tight; }
      
      .portal-card { @apply bg-white/5 backdrop-blur-2xl rounded-[2rem] p-10 border border-white/10 shadow-[0_30px_60px_rgba(0,0,0,0.4)] flex flex-col justify-between items-center text-center relative overflow-hidden transition-all duration-500 hover:-translate-y-2 hover:bg-white/10 hover:border-white/20 hover:shadow-[0_40px_80px_rgba(79,70,229,0.3)]; }
      .portal-card h3 { @apply font-bold text-white mb-4 text-3xl tracking-wide; }
      .portal-card p { @apply text-indigo-200 text-lg mb-10 leading-relaxed font-light; }

      .btn-custom { @apply w-full py-4 rounded-2xl font-bold uppercase tracking-widest text-sm transition-all duration-300 inline-block no-underline; }
      .btn-outline-admin { @apply bg-indigo-600 text-white hover:bg-indigo-500 hover:shadow-[0_10px_30px_rgba(79,70,229,0.4)]; }
      .btn-outline-emp { @apply bg-emerald-600 text-white hover:bg-emerald-500 hover:shadow-[0_10px_30px_rgba(16,185,129,0.4)]; }
    </style>
  </head>
  <body>
    <div class="landing-container">
      <h1 class="main-title">Welcome to SmartHR</h1>
      <div class="row g-4 justify-content-center align-items-stretch mt-8">
        <div class="col-md-5 col-sm-10 d-flex">
          <div class="portal-card">
            <div class="card-content">
              <h3>Admin Portal</h3>
              <p>Manage Employees, Payroll & Analytics</p>
            </div>
            <a href="admin_login.html" class="btn-custom btn-outline-admin">Login as Admin</a>
          </div>
        </div>
        <div class="col-md-5 col-sm-10 d-flex">
          <div class="portal-card">
            <div class="card-content">
              <h3>Employee Portal</h3>
              <p>Mark Attendance, Apply Leave & View Salary</p>
            </div>
            <a href="emp_login.html" class="btn-custom btn-outline-emp">Login as Employee</a>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
